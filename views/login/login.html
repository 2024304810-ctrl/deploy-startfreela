    <body>
    <div id="header" class="header">
        <a href="/"><img class="img-logo" src="/img/logo-deitada.png" alt=""></a>
    </div>
    <div id="heroPrincipal" class="heroPrincipal">
        <h1>Login</h1>    
        <form style="width: 100%;" id="formulario">
            <input class="caixasDeInformacoes" type="email" name="" id="email" placeholder="email">
            <div class="div-pass">
                <input class="caixasDeInformacoes" type="password" placeholder="senha" id="password">
                <button type="button" class="button-eye" onclick="toggleEye()">
                    <img src="/img/openeye.png" id="image-eye">
                </button>
            </div>
        
            <button class="botao_logar" type="submit">Entrar</button>
        </form>

        <div class="esquecer-cadastrar">
            <p><a id="link-esquecer" href="/reset.password">Esqueceu sua senha?</a></p>
            <p><a id="link-cadastrar" href="/register">Não possui conta?  Clique aqui para se cadastrar</a></p>
        </div>
        <div class="alternativasLogin">
            <button id="google"><img id="logo-google" src="/img/pesquisa.png" alt=""><p>Fazer login com Google</p></button>
        </div>


    </div>
        <button id="change-theme" onclick="toggleColor()"><i id="lua-sol" class="fa-solid fa-moon"></i></button>
        <script src="/js.auth/login/login.js" defer></script>
    </body>
